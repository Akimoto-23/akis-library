<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aki's Library</title>
<style>
:root{--bg:#141210;--s1:#1e1b19;--s2:#2a2622;--line:#363029;--tx:#f3eee9;--mu:#a39a90;--or:#ff7a1a;--or2:#ff9a4d;--ok:#4ade80;--er:#f87171}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:1.6rem;letter-spacing:-.02em}h2{font-size:1.15rem}
header{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.8rem 1.2rem;background:var(--s1);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.1rem}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--or);display:grid;place-items:center;color:#141210;font-style:normal}
nav{display:flex;gap:.3rem;flex-wrap:wrap}
nav button{background:none;border:0;padding:.5rem .9rem;border-radius:999px;color:var(--mu);cursor:pointer}
nav button:hover{color:var(--tx)}nav button.on{background:var(--or);color:#141210;font-weight:600}
main{flex:1;min-width:0;padding:1.5rem 1.2rem 4rem}
.shell{display:flex;align-items:flex-start}
aside{width:250px;flex:none;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;padding:1rem .7rem;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:.2rem}
.si{display:flex;align-items:center;gap:.5rem;width:100%;background:none;border:0;border-radius:10px;padding:.55rem .7rem;cursor:pointer;text-align:left;color:var(--mu)}
.si:hover{background:var(--s1);color:var(--tx)}.si.on{background:var(--s2);color:var(--tx);font-weight:600}.si span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ch{font-size:.72rem;font-weight:600;padding:.05rem .4rem;border-radius:999px;border:1px solid var(--line);color:var(--tx)}.ch.o{background:var(--or);color:#141210;border-color:var(--or)}
.fl{height:13px;width:auto;border-radius:2px;border-radius:2px;margin-right:.3rem;vertical-align:-1px}
.lab{position:absolute;top:.4rem;right:.4rem;display:inline-flex;align-items:center;gap:.3rem;background:#141210cc;border-radius:999px;padding:.25rem .4rem;line-height:0}.lab .fl{margin:0;height:15px}
.cover{position:relative}.hd{cursor:grab;color:var(--mu);padding:0 .3rem;user-select:none}.vr.drag{opacity:.4}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}.bar input{flex:1;min-width:180px}.bar select{width:auto}
.chk{display:flex;align-items:center;gap:.6rem;margin-top:.8rem;color:var(--tx)}.chk input{width:auto}
.scr{height:calc(100vh - 270px);min-height:380px;overflow:auto}.hb{background:none;border:0;font-size:1.3rem;cursor:pointer;color:var(--tx);padding:.1rem .5rem}aside.hide{display:none}
@media(max-width:800px){.shell{flex-direction:column}aside{width:100%;position:static;height:auto;flex-direction:row;overflow-x:auto;border:0}.si{width:auto;white-space:nowrap}}
.btn{background:var(--or);color:#141210;border:0;border-radius:10px;padding:.55rem 1rem;font-weight:600;cursor:pointer}
.btn:hover{background:var(--or2)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.g{background:var(--s2);color:var(--tx)}.btn.g:hover{background:var(--line)}.btn.sm{padding:.3rem .7rem;font-size:.85rem}
.btn.d{background:none;color:var(--er);border:1px solid var(--line)}
input,select,textarea{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
label{display:block;color:var(--mu);font-size:.85rem;margin:.8rem 0 .25rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1.1rem;margin-top:1.2rem}
.card{background:color-mix(in srgb,var(--c,#ff7a1a) 16%,var(--s1));border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--c,var(--or))}
.cover{aspect-ratio:2/3;background:linear-gradient(160deg,var(--s2),#3a2a1c);display:grid;place-items:center;font-size:3rem;color:var(--or);overflow:hidden}
.cover>img{width:100%;height:100%;object-fit:cover}
.card div.m{padding:.7rem .8rem}.card b{display:block;line-height:1.25}.card small,.mu{color:var(--mu)}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:1.2rem;margin-top:1rem}
.row{display:flex;align-items:center;gap:.8rem;padding:.7rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}.row .g1{flex:1;min-width:150px}
.tag{font-size:.78rem;padding:.15rem .6rem;border-radius:999px;background:var(--s2);color:var(--mu);white-space:nowrap}
.tag.free{background:#14301f;color:var(--ok)}.tag.busy{background:#3a2412;color:var(--or2)}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:1rem;z-index:20}
.modal>div{background:var(--s1);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:85vh;overflow:auto;padding:1.3rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.login{max-width:380px;margin:12vh auto;padding:0 1.2rem}
.tabs{display:flex;gap:.4rem;margin:1rem 0}
.tabs button{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:.45rem .9rem;cursor:pointer}
.tabs button.on{border-color:var(--or);color:var(--or)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--or);padding:.7rem 1.2rem;border-radius:12px;z-index:30}
.toast.err{border-color:var(--er)}
.empty{text-align:center;color:var(--mu);padding:2.5rem 1rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ====== CONFIGURA AQUI (Supabase → Project Settings → API) ======
const API_URL = 'https://lgyabjvckpypucgbmdlt.supabase.co';
const API_KEY = 'sb_publishable_xpGto1Zm5LdSwcxQHudxVw_y90rX-Vp';
// ================================================================
const LANG = {PT: 'pt', BR: 'br', EN: 'gb', ES: 'es', FR: 'fr', IT: 'it', JP: 'jp'};
let S = JSON.parse(localStorage.getItem('sess') || 'null');
let D = {me: {}, libs: [], cols: [], fl: [], fc: []};
let sb = localStorage.getItem('sb') !== '0';
let P = {};
let view = 'lib', lib = 'all', q = '', lf = '', mtab = 'col', mc = 'new', open = null, nc = 0;
let cart = [], mine = [], areq = [], users = [], notes = [], shown = new Set(), dragEl = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const fd = d => d ? new Date(d + 'T00:00').toLocaleDateString('pt-PT') : '';
const flag = l => `<img class="fl" src="https://flagcdn.com/w40/${LANG[l]}.png" alt="${l}" title="${l}">`;
const libOf = id => D.libs.find(l => l.id === +id);
const mine_ = l => l && l.owner_id === D.me.id;

async function rpc(fn, a = {}) {
  const r = await fetch(`${API_URL}/rest/v1/rpc/${fn}`, {method: 'POST',
    headers: {apikey: API_KEY, 'Content-Type': 'application/json'}, body: JSON.stringify(S ? {t: S.token, ...a} : a)});
  const j = await r.json().catch(() => null);
  if (!r.ok) { if (/Sessão/.test(j?.message)) logout(); throw new Error(j?.message || 'Erro de ligação'); }
  return j;
}
function toast(m, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m;
  document.body.append(t); setTimeout(() => t.remove(), 3000);
}
const run = async f => { try { await f(); } catch (e) { toast(e.message, true); } };
function logout() { S = null; localStorage.removeItem('sess'); draw(); }

async function go(v) {
  if (v) view = v;
  await run(async () => {
    D = await rpc('catalog'); S.name = D.me.name;
    if (view === 'profile') P = await rpc('my_profile');
    if (view === 'mine') mine = await rpc('my_requests');
    if (view === 'users') users = await rpc('list_users');
    if (view === 'notif') { notes = await rpc('my_notifications'); await rpc('mark_seen'); nc = 0; }
    if (view === 'manage' && mtab === 'req') areq = await rpc('admin_requests', {p_lib: +lib});
  });
  draw();
}

function chips(l) {
  const c = (n, t, cls, i) => n ? `<b class="ch ${cls}" title="${t}">${i}${n}</b>` : '';
  return c(l.pend, 'Os teus pedidos em espera', '', '⏳') + c(l.hold, 'Volumes teus por devolver', '', '📖') +
    c(l.req, 'Pedidos por aceitar', 'o', '🔔') + c(l.lent, 'Emprestados por devolver', 'o', '📤');
}
function nbanner() {
  if (!('Notification' in window) || Notification.permission !== 'default' || !D.me.notify || !D.me.notify_browser || sessionStorage.getItem('nd')) return '';
  return `<div class="panel" style="margin:0 0 1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap"><span class="g1">🔔 Queres receber avisos no browser quando houver novas coleções ou volumes nas bibliotecas que segues?</span>
    <button class="btn sm" data-a="nask">Ativar avisos</button><button class="btn g sm" data-a="nno">Agora não</button></div>`;
}
function draw() {
  const el = $('#app');
  if (!S) return el.innerHTML = `<form class="login" data-f="login">
    <div class="logo" style="margin-bottom:1.5rem"><i>A</i>Aki's Library</div>
    <h1>Entrar</h1><p class="mu">Usa o utilizador e a passe que o admin te deu.</p>
    <label>Utilizador</label><input name="u" autocomplete="username" required autofocus>
    <label>Passe</label><input name="p" type="password" autocomplete="current-password" required>
    <button class="btn" style="width:100%;margin-top:1.2rem">Entrar</button></form>`;
  if (S.must_change) return el.innerHTML = `<form class="login" data-f="pw">
    <h1>Bem-vindo!</h1><p class="mu">É a tua primeira entrada. Define uma passe nova e escolhe como queres ser avisado.</p>
    <label>Nova passe (mínimo 3 caracteres)</label><input name="p" type="password" autocomplete="new-password" minlength="3" required>
    <label>Repete a passe</label><input name="p2" type="password" autocomplete="new-password" minlength="3" required>
    <label>ID do Discord (para avisos por mensagem privada)</label><input name="d" inputmode="numeric" pattern="[0-9]{15,25}" placeholder="Ex.: 123456789012345678" value="${esc()}">
    <p class="mu" style="font-size:.8rem;margin-top:.3rem">Como obter: no Discord abre Definições → Avançado → liga o Modo de programador. Depois clica com o botão direito no teu nome e escolhe "Copiar ID do utilizador".</p>
    <label class="chk"><input type="checkbox" name="nt" checked>Receber notificações (novas coleções e volumes)</label>
    <label class="chk"><input type="checkbox" name="nb" checked>Avisar pelo browser (Windows), com o site aberto</label>
    <label class="chk"><input type="checkbox" name="nd" checked>Avisar por mensagem privada no Discord</label>
    <button class="btn" style="width:100%;margin-top:1.2rem">Guardar e entrar</button></form>`;
  const on = (v, l) => view === v && (l === undefined || lib === l) ? 'on' : '';
  const owned = D.libs.some(mine_);
  el.innerHTML = `<header><button class="hb" data-a="sb" aria-label="Abrir ou fechar a barra lateral">☰</button><div class="logo"><i>A</i>Aki's Library</div>
    ${owned ? '<button class="btn sm" data-a="manage">Gerir biblioteca</button>' : ''}<span style="margin-right:auto"></span>
    <nav><button data-a="nav" data-v="cart" class="${on('cart')}">Carrinho (${cart.length})</button>
    <button data-a="nav" data-v="mine" class="${on('mine')}">Os meus pedidos</button>
    ${D.me.admin ? `<button data-a="nav" data-v="users" class="${on('users')}">Utilizadores</button>` : ''}
    <button data-a="nav" data-v="notif" class="${on('notif')}">🔔${nc ? ' ' + nc : ''}</button></nav>
    <button class="btn g sm" data-a="nav" data-v="profile" title="Editar perfil">${esc(S.name)}</button><button class="btn g sm" data-a="logout">Sair</button></header>
    <div class="shell"><aside class="${sb ? '' : 'hide'}"><button class="si ${on('lib', 'all')}" data-a="sel" data-id="all"><span>Todas as Bibliotecas</span></button>
    ${D.libs.map(l => `<button class="si ${on('lib', String(l.id))}" data-a="sel" data-id="${l.id}"><i class="dot" style="background:${esc(l.color)}"></i><span>${esc(l.name)}</span>${chips(l)}</button>`).join('')}
    ${D.me.admin || !owned ? '<button class="si" data-a="nav" data-v="newlib"><span>+ Nova biblioteca</span></button>' : ''}</aside>
    <main>${nbanner()}${{lib: libV, cart: cartV, mine: mineV, users: usersV, profile: profileV, notif: notifV, newlib: newlibV, manage: manageV}[view]()}</main></div>${open ? modal() : ''}`;
}

const filt = () => D.cols.filter(c => (lib === 'all' || c.library_id === +lib) && (!lf || c.lang === lf) && c.title.toLowerCase().includes(q.toLowerCase()));
function gridH() {
  const cs = filt(); if (!cs.length) return '<div class="empty" style="grid-column:1/-1">Nada encontrado.</div>';
  return cs.map(c => { const l = libOf(c.library_id), free = c.volumes.filter(v => !v.holder).length;
    return `<button class="card" style="--c:${esc(l.color)}" data-a="open" data-id="${c.id}"><div class="cover">${c.image ? `<img src="${esc(c.image)}" alt="">` : esc(c.title[0])}<span class="lab">${flag(c.lang)}</span></div>
    <div class="m"><b>${esc(c.title)}</b><small>${free} de ${c.volumes.length} disponíveis</small>${lib === 'all' ? `<br><span class="tag">${esc(l.owner)}</span>` : ''}</div></button>`; }).join('');
}
const folBtn = (k, id, on) => `<button class="btn sm ${on ? 'g' : ''}" data-a="fol" data-k="${k}" data-id="${id}" data-on="${on ? 0 : 1}">${on ? '✓ A seguir' : '+ Seguir'}</button>`;
function libV() {
  const L = lib === 'all' ? null : libOf(lib);
  return `<div class="top"><div><h1>${L ? esc(L.name) : 'Todas as Bibliotecas'}</h1>${L ? `<span class="tag">${esc(L.owner)}</span>` : ''}</div>
    ${L && !mine_(L) ? folBtn('l', L.id, D.fl.includes(L.id)) : ''}</div>
    <div class="bar"><input id="q" placeholder="Pesquisar por nome…" value="${esc(q)}"><select id="lf"><option value="">Todos os idiomas</option>
    ${Object.keys(LANG).map(l => `<option ${lf === l ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="grid" id="grid">${gridH()}</div>`;
}
function modal() {
  const c = D.cols.find(x => x.id === open); if (!c) return ''; const l = libOf(c.library_id);
  return `<div class="modal" data-a="close"><div data-stop><div class="top"><h2>${esc(c.title)} <span class="tag">${flag(c.lang)}</span></h2><button class="btn g sm" data-a="close">Fechar</button></div>
  <p class="mu">${esc(l.name)} · ${esc(l.owner)}</p>${mine_(l) ? '' : `<div style="margin-top:.6rem">${folBtn('c', c.id, D.fc.includes(c.id))}</div>`}
  <div style="margin-top:.8rem">${c.volumes.map(v => {
    const inCart = cart.some(x => x.id === v.id);
    const st = v.holder ? `<span class="tag busy">Com ${esc(v.holder)}</span>` : `<span class="tag free">Disponível</span>`;
    const w = v.waiting ? `<span class="tag">${v.waiting} em espera</span>` : '';
    const btn = v.my_loan ? `<span class="tag busy">Tens este volume</span>` : v.my_req ? `<span class="tag">Pedido feito</span>`
      : `<button class="btn sm ${inCart ? 'g' : ''}" data-a="cart" data-id="${v.id}" data-t="${esc(c.title)}" data-l="${esc(v.label)}">${inCart ? 'Tirar do carrinho' : 'Adicionar'}</button>`;
    return `<div class="row"><div class="g1"><b>${esc(v.label)}</b></div>${st}${w}${btn}</div>`;
  }).join('') || '<div class="empty">Esta coleção ainda não tem volumes.</div>'}</div></div></div>`;
}
function cartV() {
  if (!cart.length) return `<h1>Carrinho</h1><div class="empty">O carrinho está vazio. Escolhe volumes na biblioteca.</div>`;
  return `<h1>Carrinho</h1><div class="panel">${cart.map(x => `<div class="row"><div class="g1"><b>${esc(x.title)}</b> <span class="mu">${esc(x.label)}</span></div>
    <button class="btn d sm" data-a="rm" data-id="${x.id}">Remover</button></div>`).join('')}
    <label>Data do pedido</label><input type="date" id="cd" value="${today()}" style="max-width:200px">
    <button class="btn" style="margin-top:1rem" data-a="send">Pedir ${cart.length} volume${cart.length > 1 ? 's' : ''}</button></div>`;
}
function mineV() {
  if (!mine.length) return `<h1>Os meus pedidos</h1><div class="empty">Não tens pedidos nem empréstimos ativos.</div>`;
  return `<h1>Os meus pedidos</h1><div class="panel">${mine.map(r => `<div class="row"><div class="g1"><b>${esc(r.title)}</b> <span class="mu">${esc(r.label)}</span><br><small class="mu">${esc(r.lib)}</small></div>
    ${r.status === 'pending' ? `<span class="tag">Pedido em ${fd(r.requested_for)}</span><button class="btn d sm" data-a="cancel" data-id="${r.id}">Cancelar</button>`
      : `<span class="tag busy">Emprestado desde ${fd(r.loan_date)}</span><button class="btn sm" data-a="ret" data-id="${r.id}">Confirmar devolução</button>`}</div>`).join('')}</div>`;
}
function notifV() {
  return `<h1>Notificações</h1><div class="panel">${notes.map(n => `<div class="row"><div class="g1">${esc(n.text)}<br><small class="mu">${new Date(n.created).toLocaleString('pt-PT')}</small></div>${n.seen ? '' : '<span class="tag busy">Nova</span>'}</div>`).join('') || '<div class="empty">Sem notificações. Segue bibliotecas ou coleções para seres avisado.</div>'}</div>`;
}
function profileV() {
  const m = D.me;
  return `<h1>O meu perfil</h1><div class="cols"><form class="panel" data-f="profile" style="margin:0"><h2>Dados</h2>
    <label>Nome</label><input name="n" value="${esc(m.name)}" required><label>Utilizador</label><input name="u" value="${esc(m.username)}" required autocapitalize="none">
    <label>ID do Discord (para avisos por mensagem privada)</label><input name="d" inputmode="numeric" pattern="[0-9]{15,25}" placeholder="Ex.: 123456789012345678" value="${esc(P.discord_id)}">
    <p class="mu" style="font-size:.8rem;margin-top:.3rem">Como obter: no Discord abre Definições → Avançado → liga o Modo de programador. Depois clica com o botão direito no teu nome e escolhe "Copiar ID do utilizador".</p>
    <label class="chk"><input type="checkbox" name="nt" ${m.notify ? 'checked' : ''}>Receber notificações (novas coleções e volumes)</label>
    <label class="chk"><input type="checkbox" name="nb" ${m.notify_browser ? 'checked' : ''}>Avisar pelo browser (Windows), com o site aberto</label>
    <label class="chk"><input type="checkbox" name="nd" ${P.notify_discord !== false ? 'checked' : ''}>Avisar por mensagem privada no Discord</label>
    <p class="mu" style="font-size:.85rem;margin-top:.8rem">Estado no browser: ${'Notification' in window ? {granted: 'ativos', denied: 'bloqueados (clica no cadeado junto ao endereço para permitir)', default: 'ainda por ativar'}[Notification.permission] : 'não suportado'}.
    Só recebes avisos das bibliotecas e coleções que segues.</p>
    <button type="button" class="btn g sm" data-a="ntest" style="margin-top:.4rem">Testar notificação</button><br>
    <button class="btn" style="margin-top:1rem">Guardar</button></form>
    <form class="panel" data-f="pwchg" style="margin:0"><h2>Mudar passe</h2><label>Nova passe</label><input name="p" type="password" minlength="3" required autocomplete="new-password">
    <label>Repete a passe</label><input name="p2" type="password" minlength="3" required autocomplete="new-password"><button class="btn" style="margin-top:1rem">Mudar passe</button></form></div>`;
}
function newlibV() {
  return `<h1>Nova biblioteca</h1><form class="panel" data-f="newlib" style="max-width:420px"><label>Nome</label><input name="n" required>
    <label>Cor das coleções</label><input name="c" type="color" value="#ff7a1a" style="height:44px;padding:.2rem"><button class="btn" style="margin-top:1rem">Criar biblioteca</button></form>`;
}
function usersV() {
  return `<h1>Utilizadores</h1><div class="cols"><form class="panel" data-f="user" style="margin:0"><h2>Novo utilizador</h2>
    <label>Nome</label><input name="n" required><label>Utilizador (para entrar)</label><input name="u" required autocapitalize="none">
    <label>Passe provisória</label><input name="p" minlength="3" required><button class="btn" style="margin-top:1rem">Criar utilizador</button></form>
    <div class="panel" style="margin:0"><h2>Utilizadores</h2>${users.map(u => `<div class="row"><div class="g1"><b>${esc(u.name)}</b> <span class="mu">${esc(u.username)}</span></div>
    ${u.must_change ? '<span class="tag busy">Ainda não entrou</span>' : ''}</div>`).join('')}</div></div>`;
}
const langSel = v => `<select name="l">${Object.keys(LANG).map(l => `<option ${v === l ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
const IMGB = `<label>Imagem de capa</label><input name="i" type="file" accept="image/*"><input name="iu" placeholder="ou cola aqui o link de uma imagem" style="margin-top:.5rem">
  <button type="button" class="btn g sm" data-a="isearch" style="margin-top:.5rem">Pesquisar capa online ↗</button>
  <p class="mu" style="font-size:.8rem;margin-top:.4rem">Abre o League of Comic Geeks. Clica com o botão direito na capa, "Copiar endereço da imagem", e cola no campo de link acima.</p>`;
function manageV() {
  const L = libOf(lib); if (!mine_(L)) return '<div class="empty">Escolhe uma biblioteca tua na barra lateral.</div>';
  const tabs = `<div class="tabs"><button data-a="mtab" data-t="col" class="${mtab === 'col' ? 'on' : ''}">Coleções e volumes</button>
    <button data-a="mtab" data-t="req" class="${mtab === 'req' ? 'on' : ''}">Pedidos${L.req ? ' (' + L.req + ')' : ''}</button>
    <button data-a="mtab" data-t="lib" class="${mtab === 'lib' ? 'on' : ''}">Biblioteca</button></div>`;
  const head = `<div class="top"><h1>Gerir: ${esc(L.name)}</h1><button class="btn g sm" data-a="sel" data-id="${L.id}">Ver biblioteca</button></div>${tabs}`;
  if (mtab === 'lib') return head + `<form class="panel" data-f="elib" style="max-width:420px"><label>Nome</label><input name="n" value="${esc(L.name)}" required>
    <label>Cor das coleções</label><input name="c" type="color" value="${esc(L.color)}" style="height:44px;padding:.2rem"><button class="btn" style="margin-top:1rem">Guardar biblioteca</button></form>`;
  if (mtab === 'req') return head + `<div class="panel">${areq.map(r => `<div class="row"><div class="g1"><b>${esc(r.title)}</b> <span class="mu">${esc(r.label)}</span><br><small class="mu">${esc(r.user)}</small></div>
    ${r.status === 'pending' ? `<span class="tag">Pedido em ${fd(r.requested_for)}</span>${r.busy ? '<span class="tag busy">Volume emprestado</span>'
      : `<input type="date" id="d${r.id}" value="${today()}" style="width:150px"><button class="btn sm" data-a="conf" data-id="${r.id}">Confirmar empréstimo</button>`}<button class="btn d sm" data-a="cancel" data-id="${r.id}">Apagar</button>`
      : `<span class="tag busy">Emprestado desde ${fd(r.loan_date)}</span><button class="btn sm" data-a="ret" data-id="${r.id}">Confirmar devolução</button>`}</div>`).join('') || '<div class="empty">Sem pedidos nem empréstimos ativos.</div>'}</div>`;
  const cs = D.cols.filter(c => c.library_id === L.id), c = cs.find(x => x.id === +mc);
  const list = `<div class="panel scr" style="margin:0"><button class="si ${c ? '' : 'on'}" data-a="mcsel" data-id="new"><span>+ Nova coleção</span></button>
    ${cs.map(x => `<button class="si ${c && c.id === x.id ? 'on' : ''}" data-a="mcsel" data-id="${x.id}"><span>${esc(x.title)}</span><b class="ch">${x.lang}</b></button>`).join('')}</div>`;
  const edit = !c ? `<form class="panel scr" data-f="coll" style="margin:0"><h2>Nova coleção</h2><label>Título</label><input name="t" required>
      <label>Idioma</label>${langSel('PT')}${IMGB}
      <label>Volumes (um por linha: 1, 2, 3… ou subtítulos)</label><textarea name="v" rows="5"></textarea><button class="btn" style="margin-top:1rem">Criar coleção</button></form>`
    : `<div class="panel scr" style="margin:0"><form data-f="cedit"><h2>Coleção</h2><label>Título</label><input name="t" value="${esc(c.title)}" required>
      <label>Idioma</label>${langSel(c.lang)}${IMGB}<button class="btn" style="margin-top:1rem">Guardar coleção</button></form>
      <h2 style="margin-top:1.5rem">Volumes</h2><p class="mu" style="font-size:.85rem">Arrasta o ⠿ para mudar a ordem.</p><div id="vl">${c.volumes.map(v => `<div class="row vr" data-id="${v.id}"><span class="hd" title="Arrastar">⠿</span>
      <input id="v${v.id}" value="${esc(v.label)}" style="flex:1;min-width:140px"><button class="btn sm" data-a="vsave" data-id="${v.id}">Guardar</button><button class="btn d sm" data-a="vdel" data-id="${v.id}">Apagar</button></div>`).join('') || '<div class="empty">Sem volumes.</div>'}</div>
      <form data-f="vols"><label>Adicionar volumes (um por linha)</label><textarea name="v" rows="3" required></textarea><button class="btn" style="margin-top:.8rem">Adicionar</button></form></div>`;
  return head + `<div class="cols">${list}${edit}</div>`;
}

const shrink = f => new Promise(r => { const i = new Image(); i.onload = () => {
  const k = Math.min(1, 400 / i.width), c = document.createElement('canvas'); c.width = i.width * k; c.height = i.height * k;
  c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); r(c.toDataURL('image/jpeg', .8)); }; i.src = URL.createObjectURL(f); });
const lines = s => s.split('\n').map(x => x.trim()).filter(Boolean);
const img = async f => f.i.files[0] ? shrink(f.i.files[0]) : (f.iu.value.trim() || null);

const A = {
  nav: d => { open = null; go(d.v); }, logout,
  sel: d => { lib = d.id; q = ''; lf = ''; open = null; go('lib'); },
  sb: () => { sb = !sb; localStorage.setItem('sb', sb ? '1' : '0'); draw(); },
  manage: () => { if (!mine_(libOf(lib))) lib = String(D.libs.find(mine_).id); mtab = 'col'; mc = 'new'; go('manage'); }, mtab: d => { mtab = d.t; go('manage'); },
  mcsel: d => { mc = d.id; draw(); },
  open: d => { open = +d.id; draw(); }, close: () => { open = null; draw(); },
  fol: d => run(async () => { await rpc('follow', {p_lib: d.k === 'l' ? +d.id : null, p_col: d.k === 'c' ? +d.id : null, p_on: d.on === '1'}); go(); }),
  cart: d => { const i = cart.findIndex(x => x.id === +d.id); i < 0 ? cart.push({id: +d.id, title: d.t, label: d.l}) : cart.splice(i, 1); draw(); },
  rm: d => { cart = cart.filter(x => x.id !== +d.id); draw(); },
  send: () => run(async () => { await rpc('request_volumes', {p_ids: cart.map(x => x.id), p_date: $('#cd').value}); cart = []; toast('Pedido enviado'); go('mine'); }),
  cancel: d => run(async () => { await rpc('cancel_request', {p_id: +d.id}); go(); }),
  ret: d => run(async () => { await rpc('return_loan', {p_id: +d.id}); toast('Devolução confirmada'); go(); }),
  conf: d => run(async () => { await rpc('confirm_loan', {p_id: +d.id, p_date: $('#d' + d.id).value}); toast('Empréstimo confirmado'); go(); }),
  isearch: (d, b) => { const t = b.closest('form').t?.value.trim() || '';
    window.open('https://leagueofcomicgeeks.com/search?keyword=' + encodeURIComponent(t), '_blank', 'noopener'); },
  nask: () => run(async () => { const r = await Notification.requestPermission(); toast(r === 'granted' ? 'Avisos ativados' : 'Os avisos ficaram desativados no browser', r !== 'granted'); draw(); poll(); }),
  nno: () => { sessionStorage.setItem('nd', '1'); draw(); },
  ntest: () => run(async () => { if (!('Notification' in window)) throw new Error('Este browser não suporta notificações');
    if (Notification.permission === 'default') await Notification.requestPermission();
    await rpc('send_test'); toast(Notification.permission === 'granted' ? 'Teste enviado: vê o browser e o Discord' : 'Teste enviado, mas o browser tem as notificações bloqueadas (cadeado junto ao endereço)'); draw(); poll(); }),
  vsave: d => run(async () => { await rpc('edit_volume', {p_id: +d.id, p_label: $('#v' + d.id).value}); toast('Volume guardado'); go(); }),
  vdel: d => { if (confirm('Apagar este volume e todos os pedidos e empréstimos dele?')) run(async () => { await rpc('delete_volume', {p_id: +d.id}); go(); }); },
};
const dcheck = f => { if (f.nd.checked && !f.d.value.trim()) throw new Error('Indica o teu ID do Discord ou desmarca os avisos por Discord'); };
const F = {
  elib: f => run(async () => { await rpc('edit_library', {p_id: +lib, p_name: f.n.value, p_color: f.c.value}); toast('Biblioteca guardada'); go(); }),
  login: f => run(async () => { S = await rpc('login', {p_user: f.u.value, p_pass: f.p.value}); localStorage.setItem('sess', JSON.stringify(S)); S.must_change ? draw() : start(); }),
  pw: f => run(async () => { if (f.p.value !== f.p2.value) throw new Error('As passes não coincidem'); dcheck(f);
    if (f.nb.checked && 'Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
    await rpc('first_setup', {p_pass: f.p.value, p_discord: f.d.value, p_notify: f.nt.checked, p_nb: f.nb.checked, p_nd: f.nd.checked});
    S.must_change = false; localStorage.setItem('sess', JSON.stringify(S)); start(); }),
  pwchg: f => run(async () => { if (f.p.value !== f.p2.value) throw new Error('As passes não coincidem');
    await rpc('set_password', {p_pass: f.p.value}); f.reset(); toast('Passe alterada'); }),
  profile: f => run(async () => { dcheck(f); if (f.nb.checked && 'Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
    await rpc('update_profile', {p_user: f.u.value, p_name: f.n.value, p_discord: f.d.value, p_notify: f.nt.checked, p_nb: f.nb.checked, p_nd: f.nd.checked}); toast('Perfil guardado'); go(); }),
  newlib: f => run(async () => { lib = String(await rpc('create_library', {p_name: f.n.value, p_color: f.c.value})); toast('Biblioteca criada'); mtab = 'col'; mc = 'new'; go('manage'); }),
  user: f => run(async () => { await rpc('create_user', {p_user: f.u.value, p_name: f.n.value, p_pass: f.p.value}); toast('Utilizador criado'); go(); }),
  coll: f => run(async () => { const id = await rpc('add_collection', {p_lib: +lib, p_title: f.t.value, p_image: await img(f), p_lang: f.l.value});
    const l = lines(f.v.value); if (l.length) await rpc('add_volumes', {p_coll: id, p_labels: l}); mc = String(id); toast('Coleção criada'); go(); }),
  cedit: f => run(async () => { await rpc('edit_collection', {p_id: +mc, p_title: f.t.value, p_image: await img(f), p_lang: f.l.value}); toast('Coleção guardada'); go(); }),
  vols: f => run(async () => { await rpc('add_volumes', {p_coll: +mc, p_labels: lines(f.v.value)}); toast('Volumes adicionados'); go(); }),
};
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a]) A[b.dataset.a](b.dataset, b);
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-f]'); if (f) { e.preventDefault(); F[f.dataset.f](f); } });
document.addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value; $('#grid').innerHTML = gridH(); } });
document.addEventListener('change', e => { if (e.target.id === 'lf') { lf = e.target.value; $('#grid').innerHTML = gridH(); } });
// arrastar volumes
document.addEventListener('mousedown', e => { const h = e.target.closest('.hd'); if (h) h.closest('.vr').draggable = true; });
document.addEventListener('dragstart', e => { dragEl = e.target.closest?.('.vr'); if (dragEl) { e.dataTransfer.effectAllowed = 'move'; dragEl.classList.add('drag'); } });
document.addEventListener('dragover', e => { if (!dragEl) return; e.preventDefault(); const t = e.target.closest('.vr');
  if (t && t !== dragEl) { const r = t.getBoundingClientRect(); t.parentNode.insertBefore(dragEl, e.clientY > r.top + r.height / 2 ? t.nextSibling : t); } });
document.addEventListener('dragend', () => { if (!dragEl) return; dragEl.classList.remove('drag'); dragEl.draggable = false; dragEl = null;
  run(async () => { await rpc('reorder_volumes', {p_ids: [...document.querySelectorAll('.vr')].map(x => +x.dataset.id)}); go(); }); });
// notificações
async function poll() {
  if (!S || S.must_change) return;
  try { const n = (await rpc('my_notifications')).filter(x => !x.seen); nc = n.length; const b = $('nav button:last-child'); if (b) b.textContent = '🔔' + (nc ? ' ' + nc : '');
    if (D.me.notify_browser && 'Notification' in window && Notification.permission === 'granted')
      n.filter(x => !shown.has(x.id)).forEach(x => { shown.add(x.id); new Notification("Aki's Library", {body: x.text}); }); } catch (e) {}
}
function start() { go('lib').then(poll); }
setInterval(poll, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
S && !S.must_change ? start() : draw();
</script>
</body>
</html>
